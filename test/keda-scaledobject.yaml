apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: qwen-service-vllm-queue
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: serving.trin.io/v1
    kind: InferenceService
    name: qwen-service
  minReplicaCount: 1
  # E5 runs on 2 GPU nodes; cap at 2 (beyond that pods go Unschedulable for GPU)
  maxReplicaCount: 2
  cooldownPeriod: 300 # 5-minute cooldown: large model weights load slowly, so avoid frequent start/stop (debounce)
  pollingInterval: 15 # poll metrics every 15 seconds
  triggers:
  - type: prometheus
    metadata:
      # KPS Prometheus Service lives in the monitoring namespace (not default)
      serverAddress: http://monitoring-stack-kube-prom-prometheus.monitoring.svc:9090
      metricName: vllm_requests_waiting
      # Archived q3 results guarantee only the service label; do not assume namespace
      query: sum(vllm:num_requests_waiting{service="qwen-service"})
      threshold: "1" # scale up when queue depth > 1 (threshold=10 was too deep for a single T4)
