apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: qwen-service-vllm-queue
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: serving.trin.io/v1
    kind: InferenceService
    name: qwen-service
  minReplicaCount: 1
  maxReplicaCount: 5
  cooldownPeriod: 300 # 5-minute cooldown: large model weights load slowly, so avoid frequent start/stop (debounce)
  pollingInterval: 15 # poll metrics every 15 seconds
  triggers:
  - type: prometheus
    metadata:
      serverAddress: http://monitoring-stack-prometheus-server.default.svc.cluster.local:80
      metricName: vllm_requests_waiting
      query: sum(vllm:num_requests_waiting{namespace="default",service="qwen-service"})
      threshold: "10" # Scale when the reported vLLM queue depth exceeds this value.
