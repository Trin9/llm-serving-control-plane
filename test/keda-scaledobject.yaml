apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: qwen-service-vllm-queue
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: serving.trin.io/v1
    kind: InferenceService
    name: qwen-service
  minReplicaCount: 1
  # E5 实验用 2 个 GPU 节点，上限 2（超过会让 Pod 因 GPU 不足 Unschedulable）
  maxReplicaCount: 2
  cooldownPeriod: 300 # 5-minute cooldown: large model weights load slowly, so avoid frequent start/stop (debounce)
  pollingInterval: 15 # poll metrics every 15 seconds
  triggers:
  - type: prometheus
    metadata:
      # KPS 的 Prometheus Service 在 monitoring ns（非 default）
      serverAddress: http://monitoring-stack-kube-prom-prometheus.monitoring.svc:9090
      metricName: vllm_requests_waiting
      # 实测 q3 结果只保证 service 标签，不假设 namespace 标签
      query: sum(vllm:num_requests_waiting{service="qwen-service"})
      threshold: "1" # 队列深度 >1 即扩容（单卡 T4 下 threshold=10 已是深背压）
