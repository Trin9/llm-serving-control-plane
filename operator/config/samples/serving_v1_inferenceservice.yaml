# 生产环境示例 - 使用 vLLM 引擎
apiVersion: serving.trin.io/v1
kind: InferenceService
metadata:
  labels:
    app.kubernetes.io/name: operator
    app.kubernetes.io/managed-by: kustomize
    llm-model: "qwen-qwen2-5-7b-instruct"
    serving.trin.io/model: "qwen-qwen2-5-7b-instruct"
  name: qwen-service
spec:
  modelName: "Qwen/Qwen2.5-7B-Instruct"
  replicas: 1
  engine: "vllm"
  resourceProfile: "gpu-small"
  # GPU requests select nodes that advertise nvidia.com/gpu. Uncomment only
  # the cluster-specific constraints that match this cluster's policy.
  # nodeSelector:
  #   accelerator.example.com/model: "A100"
  # tolerations:
  #   - key: "nvidia.com/gpu"
  #     operator: "Exists"
  #     effect: "NoSchedule"
  # affinity:
  #   podAntiAffinity:
  #     preferredDuringSchedulingIgnoredDuringExecution:
  #       - weight: 100
  #         podAffinityTerm:
  #           topologyKey: kubernetes.io/hostname
