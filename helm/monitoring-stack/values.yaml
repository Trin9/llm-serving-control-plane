# kube-prometheus-stack provides Prometheus Operator, Prometheus, Grafana,
# Alertmanager, ServiceMonitor/PodMonitor CRDs, and Kubernetes rules.
kube-prometheus-stack:
  alertmanager:
    enabled: true
    alertmanagerSpec:
      replicas: 1
      nodeSelector:
        kubernetes.azure.com/agentpool: nodepool1

  grafana:
    enabled: true
    adminPassword: "admin"
    # Persist Grafana state across pod restarts / cluster stop-start.
    persistence:
      enabled: true
      storageClassName: managed-csi
      size: 5Gi
    nodeSelector:
      kubernetes.azure.com/agentpool: nodepool1
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        searchNamespace: ALL
    # Grafana 13's background plugin installer self-updates bundled datasource
    # plugins at startup (e.g. prometheus 13.1.7 -> 13.1.9). With the default
    # readOnlyRootFilesystem: true the update fails ("read-only file system")
    # and the plugin process exits -> prometheus datasource becomes
    # unregistered -> every Prometheus-backed panel shows no data.
    # Keep the container root filesystem writable so bundled plugin updates succeed.
    containerSecurityContext:
      readOnlyRootFilesystem: false
    # Grafana 13.x auto-installs several background app plugins and builds bleve
    # indexes at startup; the old 256Mi limit caused OOM restarts (exit 137).
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi

  prometheus:
    enabled: true
    prometheusSpec:
      serviceMonitorSelectorNilUsesHelmValues: false
      serviceMonitorSelector: {}
      serviceMonitorNamespaceSelector: {}
      podMonitorSelectorNilUsesHelmValues: false
      podMonitorSelector: {}
      podMonitorNamespaceSelector: {}
      retention: 7d
      # Persist Prometheus TSDB (emptyDir was wiped when pods were evicted / cluster stopped).
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: managed-csi
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: 20Gi
      nodeSelector:
        kubernetes.azure.com/agentpool: nodepool1
      scrapeInterval: 15s
      evaluationInterval: 15s
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

  # Pin monitoring control-plane components to the system pool so GPU pool
  # scale-to-zero / churn cannot evict them (2026-09-19 incident: TSDB wiped).
  # NOTE: node-exporter (DaemonSet) and dcgm-exporter must NOT be pinned.
  prometheusOperator:
    nodeSelector:
      kubernetes.azure.com/agentpool: nodepool1
  kube-state-metrics:
    nodeSelector:
      kubernetes.azure.com/agentpool: nodepool1