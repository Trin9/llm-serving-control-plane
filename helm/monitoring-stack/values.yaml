# kube-prometheus-stack provides Prometheus Operator, Prometheus, Grafana,
# Alertmanager, ServiceMonitor/PodMonitor CRDs, and Kubernetes rules.
kube-prometheus-stack:
  alertmanager:
    enabled: true
    alertmanagerSpec:
      replicas: 1
      nodeSelector:
        kubernetes.azure.com/agentpool: nodepool1
    # Route everything (except the always-firing Watchdog) to the Feishu bridge.
    config:
      route:
        group_by: ["alertname", "namespace"]
        group_wait: 15s
        group_interval: 2m
        repeat_interval: 2h
        receiver: feishu
        routes:
          - matchers:
              - "alertname = Watchdog"
            receiver: "null"
      receivers:
        - name: feishu
          webhook_configs:
            - url: "http://alertmanager-feishu-bridge.monitoring.svc.cluster.local:8080/alert"
              send_resolved: true
        - name: "null"

  grafana:
    enabled: true
    adminPassword: "admin"
    # Persist Grafana state across pod restarts / cluster stop-start.
    persistence:
      enabled: true
      storageClassName: managed-csi
      size: 5Gi
    nodeSelector:
      kubernetes.azure.com/agentpool: nodepool1
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        searchNamespace: ALL
    # Grafana 13's background plugin installer self-updates bundled datasource
    # plugins at startup (e.g. prometheus 13.1.7 -> 13.1.9). With the default
    # readOnlyRootFilesystem: true the update fails ("read-only file system")
    # and the plugin process exits -> prometheus datasource becomes
    # unregistered -> every Prometheus-backed panel shows no data.
    # Keep the container root filesystem writable so bundled plugin updates succeed.
    containerSecurityContext:
      readOnlyRootFilesystem: false
    # Grafana 13.x auto-installs several background app plugins and builds bleve
    # indexes at startup; the old 256Mi limit caused OOM restarts (exit 137).
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi

  prometheus:
    enabled: true
    prometheusSpec:
      serviceMonitorSelectorNilUsesHelmValues: false
      serviceMonitorSelector: {}
      serviceMonitorNamespaceSelector: {}
      podMonitorSelectorNilUsesHelmValues: false
      podMonitorSelector: {}
      podMonitorNamespaceSelector: {}
      retention: 7d
      # Persist Prometheus TSDB (emptyDir was wiped when pods were evicted / cluster stopped).
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: managed-csi
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: 20Gi
      nodeSelector:
        kubernetes.azure.com/agentpool: nodepool1
      scrapeInterval: 15s
      evaluationInterval: 15s
      # WAL replay of an accumulated TSDB needs more headroom than 512Mi
      # (crash-looping observed 2026-09-25 during the G5 window).
      livenessProbeInitialDelaySeconds: 30
      livenessProbeTimeoutSeconds: 10
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 2Gi

  # Pin monitoring control-plane components to the system pool so GPU pool
  # scale-to-zero / churn cannot evict them (2026-09-19 incident: TSDB wiped).
  # NOTE: node-exporter (DaemonSet) and dcgm-exporter must NOT be pinned.
  prometheusOperator:
    nodeSelector:
      kubernetes.azure.com/agentpool: nodepool1
  kube-state-metrics:
    nodeSelector:
      kubernetes.azure.com/agentpool: nodepool1

  # AKS managed control plane does not expose scheduler / kube-proxy /
  # controller-manager / etcd metrics, so the kps default "XxxDown" alerts for
  # them are permanent false positives (they would spam Feishu every
  # repeat_interval). Disable those rule groups; keep everything else.
  defaultRules:
    rules:
      # NOTE: chart v89 flag names are kubeSchedulerAlerting/kubeSchedulerRecording
      # (there is no plain `kubeScheduler` key).
      kubeSchedulerAlerting: false
      kubeProxy: false
      kubeControllerManager: false
      etcd: false

# Alertmanager -> Feishu bot bridge (webhook adapter, stdlib python).
# The Feishu webhook URL stays OUT of git; create the secret first:
#   kubectl create secret generic feishu-webhook -n monitoring \
#     --from-literal=url='https://open.feishu.cn/open-apis/bot/v2/hook/<token>'
feishuBridge:
  enabled: true
  image: llmphase5eaacr.azurecr.io/python:3.12-slim
  existingSecret: feishu-webhook