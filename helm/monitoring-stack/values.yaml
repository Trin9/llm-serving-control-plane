# kube-prometheus-stack provides Prometheus Operator, Prometheus, Grafana,
# Alertmanager, ServiceMonitor/PodMonitor CRDs, and Kubernetes rules.
kube-prometheus-stack:
  alertmanager:
    enabled: true
    alertmanagerSpec:
      replicas: 1

  grafana:
    enabled: true
    adminPassword: "admin"
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        searchNamespace: ALL
    # Grafana 13's background plugin installer self-updates bundled datasource
    # plugins at startup (e.g. prometheus 13.1.7 -> 13.1.9). With the default
    # readOnlyRootFilesystem: true the update fails ("read-only file system")
    # and the plugin process exits -> prometheus datasource becomes
    # unregistered -> every Prometheus-backed panel shows no data.
    # Keep the container root filesystem writable so bundled plugin updates succeed.
    containerSecurityContext:
      readOnlyRootFilesystem: false
    # Grafana 13.x auto-installs several background app plugins and builds bleve
    # indexes at startup; the old 256Mi limit caused OOM restarts (exit 137).
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi

  prometheus:
    enabled: true
    prometheusSpec:
      serviceMonitorSelectorNilUsesHelmValues: false
      serviceMonitorSelector: {}
      serviceMonitorNamespaceSelector: {}
      podMonitorSelectorNilUsesHelmValues: false
      podMonitorSelector: {}
      podMonitorNamespaceSelector: {}
      retention: 7d
      scrapeInterval: 15s
      evaluationInterval: 15s
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi