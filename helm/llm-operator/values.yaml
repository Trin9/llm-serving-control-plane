# Default configuration (for local development)

replicaCount: 1

image:
  repository: controller
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Whether to create a ServiceAccount
  create: true
  # ServiceAccount name
  name: "controller-manager"
  # ServiceAccount annotations
  annotations: {}

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# Container security context
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - "ALL"

# Resource limits (local environment)
resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

# Leader Election configuration
leaderElection:
  enabled: true

# Health checks
healthProbe:
  port: 8081
  livenessProbe:
    initialDelaySeconds: 15
    periodSeconds: 20
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Extra labels (these are merged onto all resources)
# Note: do not redefine existing labels, to avoid overriding values generated by template functions
labels: {}
  # Example: add custom labels
  # environment: production
  # team: ai-platform

# ==========================================================
# Subchart configuration (AI gateway)
# These settings override identically-named settings in charts/gate-service/values.yaml
# ==========================================================
gate-service:
  # Enable the gateway component by default
  enabled: true
  
  replicaCount: 3
  
  image:
    repository: gate-service
    tag: latest
    pullPolicy: IfNotPresent
    
  env:
    # Existing Secret with JWT_SECRET, REDIS_PASSWORD, and VLLM_API_KEY.
    # Keep this empty only for local/mock deployments that do not use JWT or upstream auth.
    existingSecret: ""
    # You can globally override the gateway routing backend addresses here
    VLLM_URLS: "http://mock-service.default.svc.cluster.local:8000/v1/chat/completions"
    REDIS_ADDR: "llm-operator-redis.default.svc.cluster.local:6379"

redis:
  enabled: true
  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent
