# Production configuration (for AWS EKS)

# High-availability configuration
replicaCount: 2

image:
  # Production should use ECR or another private image registry
  repository: <your-ecr-repo>/llm-operator
  tag: v1.0.0
  pullPolicy: Always

imagePullSecrets: []

serviceAccount:
  create: true
  name: "controller-manager"
  # AWS-specific annotations (e.g. IRSA)
  annotations:
    # eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/llm-operator-role

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - "ALL"

# Production resource configuration
resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 500m
    memory: 256Mi

leaderElection:
  enabled: true

healthProbe:
  port: 8081
  livenessProbe:
    initialDelaySeconds: 15
    periodSeconds: 20
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10

# Node selector (ensures scheduling on Linux nodes)
nodeSelector:
  kubernetes.io/os: linux

# Tolerations (e.g. allow scheduling on specific nodes)
tolerations: []
# - key: "node-role.kubernetes.io/control-plane"
#   effect: NoSchedule

# Affinity (Pod anti-affinity for high availability)
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchLabels:
            control-plane: controller-manager
        topologyKey: kubernetes.io/hostname

labels:
  control-plane: controller-manager
  app.kubernetes.io/name: operator
  app.kubernetes.io/managed-by: helm
  environment: production
