{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-gate-service
  labels:
    app: gate-service
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: gate-service
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: gate-service
        release: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}-gate-service
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Phase 6 (T-F4): give the gateway time to drain in-flight SSE streams on
      # SIGTERM. Must be >= SHUTDOWN_GRACE_PERIOD (default 25s) + preStop sleep.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | default 30 }}
      containers:
        - name: gate-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # Phase 6 (T-F4): brief pause before the SIGTERM handler runs so
          # kube-proxy has time to remove this pod from Endpoints. New streams
          # then land on other replicas while this pod drains its in-flight ones.
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep {{ .Values.preStopSleepSeconds | default 5 }}
          {{- with .Values.env.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          env:
            - name: KUBE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: VLLM_URLS
              value: {{ .Values.env.VLLM_URLS | quote }}
            - name: REDIS_ADDR
              value: {{ .Values.env.REDIS_ADDR | quote }}
            - name: SHUTDOWN_GRACE_PERIOD
              value: {{ .Values.env.SHUTDOWN_GRACE_PERIOD | default "25" | quote }}
            {{- with .Values.env.ROUTER_STRATEGY }}
            # Phase 6 (T-A2): prefix-hash (default) or random (A/B baseline).
            - name: ROUTER_STRATEGY
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.env.RATE_LIMIT_RPS }}
            # Phase 6 (T-F1): distributed rate limit (shared across replicas).
            - name: RATE_LIMIT_RPS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.env.RATE_LIMIT_BURST }}
            - name: RATE_LIMIT_BURST
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.env.ADMIN_USER_IDS }}
            # Phase 6 (T-F3): JWT userIDs allowed to call /admin/billing/settle.
            - name: ADMIN_USER_IDS
              value: {{ . | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
