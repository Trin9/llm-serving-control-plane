# Default configuration for gate-service (overridden by the gate-service section of the parent values.yaml)

enabled: true
replicaCount: 1

image:
  repository: gate-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

env:
  # Existing Secret whose keys are injected as environment variables. Production
  # deployments should provide JWT_SECRET, REDIS_PASSWORD, and VLLM_API_KEY here.
  existingSecret: ""
  # Comma-separated URL list of routing backends. By default points to a mock service.
  VLLM_URLS: "http://mock-service.default.svc.cluster.local:8000/v1/chat/completions"
  REDIS_ADDR: "llm-operator-redis.default.svc.cluster.local:6379"
