# Default configuration for gate-service (overridden by the gate-service section of the parent values.yaml)

enabled: true
replicaCount: 1

# Phase 6 (T-F4): SSE graceful drain. The pod is given this many seconds to
# drain in-flight streams after SIGTERM. Must be >= SHUTDOWN_GRACE_PERIOD +
# preStopSleepSeconds so the container is not SIGKILLed mid-drain.
terminationGracePeriodSeconds: 30
preStopSleepSeconds: 5

image:
  repository: gate-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

env:
  # Existing Secret whose keys are injected as environment variables. Production
  # deployments should provide JWT_SECRET, REDIS_PASSWORD, and VLLM_API_KEY here.
  existingSecret: ""
  # Comma-separated URL list of routing backends. By default points to a mock service.
  VLLM_URLS: "http://mock-service.default.svc.cluster.local:8000/v1/chat/completions"
  REDIS_ADDR: "llm-operator-redis.default.svc.cluster.local:6379"
  # Phase 6 (T-A2): request routing strategy - prefix-hash (default) keeps
  # same-prefix requests on one backend; random spreads uniformly (A/B baseline).
  ROUTER_STRATEGY: "prefix-hash"
  # Phase 6 (T-F1): distributed rate limit (shared across replicas via Redis).
  # Leave empty to use the gateway defaults (RPS=1000, burst=2000).
  RATE_LIMIT_RPS: ""
  RATE_LIMIT_BURST: ""
  # Phase 6 (T-F3): comma-separated JWT userIDs allowed to call /admin/billing/settle.
  ADMIN_USER_IDS: ""
  # Phase 6 (T-F4): max seconds the gateway spends draining in-flight SSE
  # streams after SIGTERM before force-closing them.
  SHUTDOWN_GRACE_PERIOD: "25"

# Node selector (closeout-final: pin control-plane components away from the GPU pool).
nodeSelector: {}
