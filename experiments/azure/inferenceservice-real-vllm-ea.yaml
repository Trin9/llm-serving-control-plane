# E0/E1 experiment: REAL vLLM on a single GPU (AKS Standard_NC4as_T4_v3).
#
# Profile: gpu-t4-small = 1 GPU / 2 CPU / 12Gi  (fits NC4as_T4_v3 allocatable)
# Model:   small public instruct model (fast image/weights download on T4)
#
# NOTE: resourceProfile is part of the CRD enum; it only takes effect if the
# deployed operator contains the gpu-t4-small mapping (added in this repo).
apiVersion: serving.trin.io/v1
kind: InferenceService
metadata:
  # Must match test/vllm-servicemonitor.yaml's selector (serving.trin.io/inferenceservice: qwen-service)
  name: qwen-service
  namespace: default
spec:
  modelName: "Qwen/Qwen2.5-0.5B-Instruct"
  engine: "vllm"
  # Pin the real vLLM image to the ACR copy (server-side imported from Docker Hub)
  # so AKS pulls do not depend on docker.io availability or :latest drift.
  image: "llmphase5eaacr.azurecr.io/vllm/vllm-openai:latest"
  imagePullPolicy: "IfNotPresent"
  resourceProfile: "gpu-t4-small"
  replicas: 1 # E4: set to 2 after two GPU nodes are ready

  # Pin the workload to the GPU node pool and tolerate its Spot taint.
  # AKS adds kubernetes.azure.com/scalesetpriority=spot:NoSchedule to Spot node
  # pools, so any pod that must land on gputest needs this toleration.
  nodeSelector:
    agentpool: gputest
  tolerations:
    - key: "kubernetes.azure.com/scalesetpriority"
      operator: "Equal"
      value: "spot"
      effect: "NoSchedule"
