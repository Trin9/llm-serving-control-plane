apiVersion: v1
kind: Pod
metadata:
  name: pending-test
  namespace: default
  labels:
    app: pending-test
spec:
  containers:
  - name: pause
    image: llmphase5eaacr.azurecr.io/python:3.12-slim
    command: ["sleep", "7200"]
    resources:
      requests:
        nvidia.com/gpu: "99"
      limits:
        nvidia.com/gpu: "99"
  restartPolicy: Never
