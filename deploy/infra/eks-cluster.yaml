apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: llm-inference-cluster
  region: ap-northeast-1
  version: "1.29"

iam:
  withOIDC: true

addons:
  - name: aws-fsx-csi-driver
    version: latest

managedNodeGroups:
  # 1. Gate Service node (uses Spot instances to save costs)
  - name: cpu-ng
    instanceTypes: 
      - t3.medium
      - t3a.medium  # add alternative instance types to improve Spot availability
    desiredCapacity: 2
    minSize: 1
    maxSize: 3
    spot: true  # managedNodeGroups supports the spot field

  # 2. LLM GPU node
  - name: gpu-ng
    instanceTypes:
      - g4dn.xlarge
    desiredCapacity: 1
    minSize: 0
    maxSize: 2
    availabilityZones: ["ap-northeast-1d"]
    labels: 
      nvidia.com/gpu: "true"
    
    iam:
      withAddonPolicies:
        fsx: true
    
    taints:
      - key: "nvidia.com/gpu"
        value: "true"
        effect: "NoSchedule"