apiVersion: v1
kind: PersistentVolume
metadata:
  name: model-pv
spec:
  capacity:
    storage: 1200Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: fsx.csi.aws.com
    volumeHandle: ${FSX_ID}  # replace with the actual ID
    volumeAttributes:
      mountname: "vpre3bev"
      dnsname: "${FSX_ID}.fsx.ap-northeast-1.amazonaws.com" # update the DNS
      region: "ap-northeast-1"
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: topology.fsx.csi.aws.com/zone
          operator: In
          values: ["ap-northeast-1d"] # must match the AZ in the cluster YAML